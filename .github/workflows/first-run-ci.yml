name: First Run CI

on:
  push:
    branches:
      - feat/primeira-execucao-timbe
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Preparar Maven Wrapper
        run: chmod +x mvnw

      - name: Testes
        run: ./mvnw test
