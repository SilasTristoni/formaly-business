name: Timbé Demo Pages

on:
  push:
    branches:
      - feat/prototipo-empresarial-timbe-v0
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: timbe-demo-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Preparar site estático
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p _site/css _site/js _site/assets
          cp -R src/main/resources/static/css/. _site/css/
          cp -R src/main/resources/static/assets/. _site/assets/
          cp pages-demo/index.html _site/index.html
          cp pages-demo/aluno.html _site/aluno.html
          cp -R pages-demo/js/. _site/js/
          cp pages-demo/css/demo-signature.css _site/css/demo-signature.css
          touch _site/.nojekyll

      - name: Configurar Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload do artefato
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Publicar no GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
