<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Formaly Business | Aluno</title>
  <meta name="theme-color" content="#0170b9">
  <link rel="stylesheet" href="./css/business.css">
  <script src="https://unpkg.com/@phosphor-icons/web"></script>
</head>
<body>
  <div id="toastContainer" class="toast-stack" aria-live="polite"></div>
  <main class="student-shell-main">
    <header class="student-header">
      <div class="brand-lockup">
        <span class="brand-symbol"><i class="ph ph-student"></i></span>
        <div>
          <strong>Formaly Business</strong>
          <span>Área do aluno</span>
        </div>
      </div>
      <button id="logoutBtn" class="button"><i class="ph ph-sign-out"></i> Sair</button>
    </header>

    <section id="studentState" class="state">Carregando seu painel...</section>

    <section class="student-grid" id="studentContent" hidden>
      <article class="panel">
        <div class="panel__head"><h1 class="panel__title" id="studentName">Aluno</h1></div>
        <div id="studentProfile" class="stack"></div>
      </article>
      <article class="panel">
        <div class="panel__head"><h2 class="panel__title">Resumo</h2></div>
        <div id="studentMetrics" class="metric-grid"></div>
      </article>
      <article class="panel">
        <div class="panel__head"><h2 class="panel__title">Checklist documental</h2></div>
        <div id="studentChecklist" class="stack"></div>
      </article>
      <article class="panel">
        <div class="panel__head"><h2 class="panel__title">Comprovantes</h2></div>
        <form id="studentReceiptForm" class="form-grid">
          <label><span>Arquivo</span><input id="studentReceiptFile" type="file" accept=".pdf,.jpg,.jpeg,.png" required></label>
          <label><span>Descrição</span><input id="studentReceiptDescription" type="text" value="Comprovante de pagamento"></label>
          <button class="button button--primary" type="submit"><i class="ph ph-upload"></i> Enviar comprovante</button>
        </form>
      </article>
      <article class="panel">
        <div class="panel__head"><h2 class="panel__title">Próximos eventos</h2></div>
        <div id="studentEvents" class="stack"></div>
      </article>
    </section>

    <footer class="muted">Protótipo conceitual para validação — não representa uma plataforma oficial da Timbé Eventos.</footer>
  </main>

  <dialog id="uploadDialog"><form id="studentUploadForm" class="modal" method="dialog"></form></dialog>
  <script type="module" src="./js/student-business.js"></script>
</body>
</html>
