spring.datasource.url=${DB_URL:jdbc:h2:file:./target/formaly-business-demo;MODE=MySQL;DATABASE_TO_LOWER=TRUE;AUTO_SERVER=TRUE}
spring.datasource.username=${DB_USERNAME:sa}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=org.h2.Driver
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:update}
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect
spring.jpa.show-sql=false
spring.flyway.enabled=${FLYWAY_ENABLED:true}

app.security.jwt-secret=${APP_SECURITY_JWT_SECRET:local-demo-change-me-formaly-business}
app.demo.seed-enabled=${APP_DEMO_SEED_ENABLED:true}
app.demo.admin-password=${APP_DEMO_ADMIN_PASSWORD:DemoAdmin2026!}
app.demo.collaborator-password=${APP_DEMO_COLLABORATOR_PASSWORD:DemoColaborador2026!}
app.demo.committee-password=${APP_DEMO_COMMITTEE_PASSWORD:DemoComissao2026!}
app.demo.student-password=${APP_DEMO_STUDENT_PASSWORD:DemoAluno2026!}
app.storage.local-path=${FORMALY_STORAGE_PATH:${user.home}/.formaly-business/uploads-demo-h2}
