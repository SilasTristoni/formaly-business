spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/formaly_business?createDatabaseIfNotExist=true&useUnicode=true&characterEncoding=UTF-8&serverTimezone=America/Sao_Paulo}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.show-sql=${JPA_SHOW_SQL:false}
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:update}
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

server.servlet.encoding.charset=UTF-8
server.servlet.encoding.force=true
server.port=${PORT:${SERVER_PORT:8080}}

app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS:http://localhost:8080,http://127.0.0.1:8080}
app.security.jwt-secret=${APP_SECURITY_JWT_SECRET:}
app.security.jwt-issuer=${APP_SECURITY_JWT_ISSUER:Formaly Business API}
app.security.jwt-expiration-hours=${APP_SECURITY_JWT_EXPIRATION_HOURS:2}
app.demo.seed-enabled=${APP_DEMO_SEED_ENABLED:false}
app.demo.admin-password=${APP_DEMO_ADMIN_PASSWORD:}
app.demo.collaborator-password=${APP_DEMO_COLLABORATOR_PASSWORD:}
app.demo.committee-password=${APP_DEMO_COMMITTEE_PASSWORD:}
app.demo.student-password=${APP_DEMO_STUDENT_PASSWORD:}
app.storage.local-path=${FORMALY_STORAGE_PATH:${user.home}/.formaly-business/uploads}

spring.servlet.multipart.max-file-size=${FORMALY_UPLOAD_MAX_FILE_SIZE:10MB}
spring.servlet.multipart.max-request-size=${FORMALY_UPLOAD_MAX_REQUEST_SIZE:12MB}
spring.flyway.enabled=${FLYWAY_ENABLED:true}
